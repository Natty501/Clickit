<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>rebreb ♡</title>

<style>

/* =========================
   BASIC
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(circle at 50% 40%, #78c4f5 0%, #5da9e9 45%, #428bd0 100%);

    font-family: Arial, sans-serif;
    position: relative;
}


/* =========================
   MAIN CENTER
========================= */

.main {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    z-index: 20;
}

.title {
    color: white;

    font-family:
        "Brush Script MT",
        "Segoe Script",
        "Lucida Handwriting",
        cursive;

    font-size: clamp(34px, 7vw, 62px);

    font-weight: 400;

    letter-spacing: 2px;

    text-shadow:
        0 2px 8px rgba(0,0,0,0.12);

    animation: gentle 3s ease-in-out infinite;
}

@keyframes gentle {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-4px);
    }
}


/* =========================
   CLICK HERE
========================= */

.click {

    display: inline-block;

    margin-top: 3px;

    color: rgba(255,255,255,0.95);

    font-family:
        "Trebuchet MS",
        sans-serif;

    font-size: 13px;

    letter-spacing: 2px;

    text-decoration: underline;

    text-underline-offset: 4px;

    cursor: pointer;

    transition: 0.25s ease;
}

.click:hover {

    transform: scale(1.08);

    color: #fff;

    text-shadow:
        0 0 10px rgba(255,255,255,0.8);
}


/* =========================
   FLOWER
========================= */

.flower {

    position: absolute;

    width: 42px;
    height: 42px;

    z-index: 5;

    animation:
        flowerFloat 4s ease-in-out infinite;
}

.petal {

    position: absolute;

    width: 17px;
    height: 25px;

    left: 13px;
    top: 0;

    border-radius: 50%;

    transform-origin: 50% 100%;
}

.p1 {
    transform: rotate(0deg) translateY(-6px);
}

.p2 {
    transform: rotate(72deg) translateY(-6px);
}

.p3 {
    transform: rotate(144deg) translateY(-6px);
}

.p4 {
    transform: rotate(216deg) translateY(-6px);
}

.p5 {
    transform: rotate(288deg) translateY(-6px);
}

.flower-center {

    position: absolute;

    width: 12px;
    height: 12px;

    left: 15px;
    top: 15px;

    background: #ffe066;

    border-radius: 50%;

    z-index: 3;
}


/* FLOWER COLORS */

.pink .petal {
    background: #ff91b5;
}

.yellow .petal {
    background: #ffe477;
}

.purple .petal {
    background: #c5a1ff;
}

.white .petal {
    background: #fff;
}

.orange .petal {
    background: #ffae70;
}


/* FLOWER POSITIONS */

.f1 {
    left: 7%;
    top: 12%;
}

.f2 {
    right: 9%;
    top: 18%;
}

.f3 {
    left: 13%;
    bottom: 23%;
}

.f4 {
    right: 12%;
    bottom: 20%;
}

.f5 {
    left: 43%;
    top: 7%;
}

.f6 {
    right: 34%;
    bottom: 8%;
}

.f7 {
    left: 3%;
    top: 48%;
}

.f8 {
    right: 3%;
    top: 50%;
}

@keyframes flowerFloat {

    0%, 100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(-13px)
            rotate(10deg);
    }
}


/* =========================
   STANDING FLOWERS
========================= */

.standing {

    position: absolute;

    bottom: -5px;

    width: 65px;
    height: 190px;

    z-index: 6;
}

.stem {

    position: absolute;

    bottom: 0;
    left: 30px;

    width: 4px;
    height: 125px;

    background: #39945d;

    border-radius: 10px;
}

.leaf {

    position: absolute;

    width: 30px;
    height: 15px;

    background: #4ba968;

    border-radius: 100% 0 100% 0;
}

.leaf-left {

    left: 2px;
    bottom: 48px;

    transform: rotate(25deg);
}

.leaf-right {

    right: 0;
    bottom: 72px;

    transform:
        rotate(-25deg)
        scaleX(-1);
}

.standing-flower {

    position: absolute;

    left: 9px;
    top: 0;

    width: 45px;
    height: 45px;
}


/* STANDING POSITIONS */

.stand1 {
    left: 5%;
}

.stand2 {
    left: 24%;
    transform: scale(.7);
}

.stand3 {
    right: 23%;
    transform: scale(.75);
}

.stand4 {
    right: 5%;
    transform: scale(.9);
}


/* =========================
   SMALL FLOWER CONFETTI
========================= */

.mini-flower {

    position: absolute;

    font-size: 15px;

    animation:
        miniFall linear infinite;

    z-index: 2;

    pointer-events: none;
}

@keyframes miniFall {

    from {
        transform:
            translateY(-50px)
            rotate(0deg);
    }

    to {
        transform:
            translateY(110vh)
            rotate(540deg);
    }
}


/* =========================
   SPARKLES
========================= */

.sparkle {

    position: absolute;

    color: white;

    font-size: 18px;

    opacity: .75;

    animation:
        sparkle 2s ease-in-out infinite;

    z-index: 3;
}

.s1 {
    top: 22%;
    left: 25%;
}

.s2 {
    top: 34%;
    right: 22%;
}

.s3 {
    bottom: 31%;
    left: 34%;
}

.s4 {
    bottom: 18%;
    right: 33%;
}

@keyframes sparkle {

    0%, 100% {
        opacity: .25;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
    }
}


/* =========================
   POPUP BACKGROUND
========================= */

.popup-overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(35, 93, 145, 0.28);

    backdrop-filter: blur(3px);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 100;
}


/* =========================
   POPUP BOX
========================= */

.popup {

    position: relative;

    width: min(82vw, 390px);
    height: min(65vh, 420px);

    background:
        rgba(255,255,255,0.96);

    border-radius: 22px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.2);

    overflow: hidden;

    border: 2px solid rgba(255,255,255,.8);

    animation:
        popupOpen .35s ease-out;
}

@keyframes popupOpen {

    from {
        opacity: 0;
        transform: scale(.75);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


/* =========================
   CLOSE BUTTON
========================= */

.close {

    position: absolute;

    top: 10px;
    right: 14px;

    width: 30px;
    height: 30px;

    border: none;

    background: rgba(90,160,220,.12);

    color: #5798ce;

    border-radius: 50%;

    font-size: 20px;

    line-height: 30px;

    cursor: pointer;

    z-index: 200;

    transition: .2s;
}

.close:hover {

    background: #5798ce;

    color: white;

    transform: rotate(90deg);
}


/* =========================
   FALLING LOVE MESSAGES
========================= */

.love-rain {

    position: absolute;

    inset: 0;

    overflow: hidden;

    pointer-events: none;
}

.love-message {

    position: absolute;

    top: -30px;

    white-space: nowrap;

    font-family:
        "Trebuchet MS",
        sans-serif;

    font-size: 11px;

    color: #76aee0;

    opacity: .9;

    animation:
        loveFall linear forwards;
}

@keyframes loveFall {

    from {
        transform:
            translateY(-40px)
            rotate(-8deg);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    90% {
        opacity: .9;
    }

    to {
        transform:
            translateY(470px)
            rotate(8deg);

        opacity: 0;
    }
}


/* =========================
   POPUP CENTER DECORATION
========================= */

.popup-title {

    position: absolute;

    bottom: 18px;

    left: 0;
    right: 0;

    text-align: center;

    color: #79aeda;

    font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-size: 20px;

    opacity: .8;

    pointer-events: none;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .title {
        font-size: 42px;
    }

    .click {
        font-size: 12px;
    }

    .standing {
        transform: scale(.7);
    }

    .stand2,
    .stand3 {
        display: none;
    }

    .popup {
        width: 84vw;
        height: 60vh;
    }
}

</style>
</head>


<body>

<!-- =========================
     FLOWER CONFETTI
========================= -->

<script>

const flowerSymbols = [
    "✿",
    "❀",
    "✾",
    "❁",
    "🌸",
    "🌼"
];

const flowerColors = [
    "#ffffff",
    "#ffd1df",
    "#ffe88a",
    "#e1ccff",
    "#ffb997"
];

for (let i = 0; i < 45; i++) {

    const flower =
        document.createElement("div");

    flower.className = "mini-flower";

    flower.innerText =
        flowerSymbols[
            Math.floor(
                Math.random() *
                flowerSymbols.length
            )
        ];

    flower.style.left =
        Math.random() * 100 + "vw";

    flower.style.color =
        flowerColors[
            Math.floor(
                Math.random() *
                flowerColors.length
            )
        ];

    flower.style.fontSize =
        (9 + Math.random() * 10) + "px";

    flower.style.animationDuration =
        (5 + Math.random() * 8) + "s";

    flower.style.animationDelay =
        (-Math.random() * 10) + "s";

    document.body.appendChild(flower);
}


/* =========================
   POPUP
========================= */

function openPopup() {

    const overlay =
        document.getElementById("popupOverlay");

    overlay.style.display = "flex";

    startLoveRain();
}


function closePopup() {

    const overlay =
        document.getElementById("popupOverlay");

    overlay.style.display = "none";


    /* Stop all falling messages */

    const rain =
        document.getElementById("loveRain");

    rain.innerHTML = "";


    /* Stop the interval */

    clearInterval(loveInterval);

    loveInterval = null;
}


/* =========================
   LOVE MESSAGE RAIN
========================= */

const messages = [

    "i love you",
    "i love you more",
    "pretty",
    "i love you ♡",
    "i love you more ♡",
    "pretty pretty",
    "i love you",
    "pretty ♡"

];

let loveInterval = null;


function createLoveMessage() {

    const rain =
        document.getElementById("loveRain");

    const message =
        document.createElement("div");

    message.className =
        "love-message";


    /* Random message */

    message.innerText =
        messages[
            Math.floor(
                Math.random() *
                messages.length
            )
        ];


    /* Random position */

    message.style.left =
        Math.random() * 90 + "%";


    /* Random falling speed */

    message.style.animationDuration =
        (3 + Math.random() * 3) + "s";


    /* Random font size */

    message.style.fontSize =
        (9 + Math.random() * 5) + "px";


    /* Slight random color */

    const colors = [
        "#76aee0",
        "#e59ab3",
        "#a991d1",
        "#91bce0"
    ];

    message.style.color =
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];


    rain.appendChild(message);


    /* Remove after animation */

    setTimeout(() => {

        message.remove();

    }, 6500);

}


function startLoveRain() {

    /* Prevent duplicate intervals */

    if (loveInterval !== null) {
        return;
    }


    /* Initial messages */

    for (let i = 0; i < 12; i++) {

        setTimeout(() => {

            createLoveMessage();

        }, i * 100);

    }


    /* Continue falling */

    loveInterval =
        setInterval(() => {

            createLoveMessage();

        }, 180);

}


/* =========================
   CLOSE WHEN CLICKING OUTSIDE
========================= */

document
    .getElementById("popupOverlay")
    .addEventListener("click", function(event) {

        if (event.target === this) {

            closePopup();

        }

    });

</script>


<!-- =========================
     POPUP HTML
========================= -->

<div
    class="popup-overlay"
    id="popupOverlay"
>

    <div class="popup">

        <button
            class="close"
            onclick="closePopup()"
        >
            ×
        </button>


        <div
            class="love-rain"
            id="loveRain"
        >
        </div>


        <div class="popup-title">
            ♡
        </div>

    </div>

</div>


</body>
