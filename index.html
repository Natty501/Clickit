<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>rebreb ♡</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      position: relative;

      background:
        linear-gradient(
          135deg,
          #4da3e8,
          #72b9ef,
          #4b9ddd
        );

      font-family: Arial, sans-serif;
    }


    /* =================================
       CENTER CONTENT
    ================================= */

    .center {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      text-align: center;

      z-index: 50;
    }


    /* MAIN TEXT */

    .title {
      color: white;

      font-family:
        "Brush Script MT",
        "Segoe Script",
        "Lucida Handwriting",
        cursive;

      font-size: clamp(34px, 7vw, 58px);

      font-weight: 400;

      letter-spacing: 3px;

      text-shadow:
        0 3px 12px rgba(0,0,0,0.12);

      animation: gentle 3s ease-in-out infinite;
    }


    @keyframes gentle {

      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }

    }


    /* CLICK HERE */

    .click-button {

      margin-top: 10px;

      border: none;

      background: rgba(255,255,255,0.2);

      color: white;

      padding: 9px 22px;

      border-radius: 30px;

      font-size: 13px;

      letter-spacing: 1px;

      cursor: pointer;

      backdrop-filter: blur(5px);

      transition: 0.3s;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.08);
    }


    .click-button:hover {

      background: rgba(255,255,255,0.35);

      transform: scale(1.06);
    }


    /* =================================
       FLOWERS
    ================================= */

    .flower {

      position: absolute;

      width: 45px;
      height: 45px;

      z-index: 5;

      animation:
        floating 4s ease-in-out infinite;
    }


    .petal {

      position: absolute;

      width: 18px;
      height: 27px;

      left: 14px;
      top: 0;

      border-radius: 50%;

      transform-origin:
        50% 100%;
    }


    .p1 {
      transform:
        rotate(0deg)
        translateY(-7px);
    }

    .p2 {
      transform:
        rotate(72deg)
        translateY(-7px);
    }

    .p3 {
      transform:
        rotate(144deg)
        translateY(-7px);
    }

    .p4 {
      transform:
        rotate(216deg)
        translateY(-7px);
    }

    .p5 {
      transform:
        rotate(288deg)
        translateY(-7px);
    }


    .flower-center {

      position: absolute;

      width: 13px;
      height: 13px;

      top: 16px;
      left: 16px;

      border-radius: 50%;

      background: #ffd84d;

      z-index: 3;
    }


    /* FLOWER COLORS */

    .pink .petal {
      background: #ff91b5;
    }

    .yellow .petal {
      background: #ffe27a;
    }

    .purple .petal {
      background: #c8a6ff;
    }

    .white .petal {
      background: #ffffff;
    }

    .orange .petal {
      background: #ffb36b;
    }

    .blue .petal {
      background: #8ee0ff;
    }


    @keyframes floating {

      0%, 100% {
        transform:
          translateY(0)
          rotate(0deg);
      }

      50% {
        transform:
          translateY(-15px)
          rotate(10deg);
      }

    }


    /* =================================
       FLOWER POSITIONS
    ================================= */

    .f1 {
      top: 8%;
      left: 8%;
    }

    .f2 {
      top: 18%;
      right: 10%;
    }

    .f3 {
      top: 42%;
      left: 4%;
    }

    .f4 {
      top: 48%;
      right: 5%;
    }

    .f5 {
      top: 7%;
      left: 45%;
    }

    .f6 {
      bottom: 18%;
      left: 13%;
    }

    .f7 {
      bottom: 25%;
      right: 13%;
    }

    .f8 {
      bottom: 8%;
      left: 48%;
    }


    /* =================================
       STANDING FLOWERS
    ================================= */

    .standing {

      position: absolute;

      bottom: -5px;

      width: 70px;
      height: 190px;

      z-index: 8;
    }


    .stem {

      position: absolute;

      width: 5px;
      height: 125px;

      bottom: 0;
      left: 32px;

      background: #3b9b5f;

      border-radius: 10px;
    }


    .leaf {

      position: absolute;

      width: 34px;
      height: 16px;

      background: #4caf6b;

      border-radius:
        100% 0 100% 0;
    }


    .leaf-left {

      left: 2px;
      bottom: 55px;

      transform:
        rotate(25deg);
    }


    .leaf-right {

      right: 0;
      bottom: 78px;

      transform:
        rotate(-25deg)
        scaleX(-1);
    }


    .standing .flower {

      top: 0;
      left: 10px;

      position: absolute;

      animation:
        standingFloat 3s ease-in-out infinite;
    }


    @keyframes standingFloat {

      0%, 100% {
        transform: rotate(-2deg);
      }

      50% {
        transform: rotate(4deg);
      }

    }


    .stand1 {
      left: 5%;
    }

    .stand2 {
      right: 5%;
      transform: scale(0.9);
    }

    .stand3 {
      left: 25%;
      transform: scale(0.7);
    }

    .stand4 {
      right: 25%;
      transform: scale(0.75);
    }


    /* =================================
       FALLING FLOWER CONFETTI
    ================================= */

    .falling-flower {

      position: absolute;

      top: -60px;

      z-index: 2;

      animation:
        flowerFall linear infinite;
    }


    @keyframes flowerFall {

      0% {
        transform:
          translateY(-70px)
          rotate(0deg);
      }

      100% {
        transform:
          translateY(110vh)
          rotate(360deg);
      }

    }


    /* =================================
       SPARKLES
    ================================= */

    .sparkle {

      position: absolute;

      color: white;

      font-size: 18px;

      opacity: 0.7;

      animation:
        sparkle 2s ease-in-out infinite;
    }


    @keyframes sparkle {

      0%, 100% {
        opacity: 0.2;
        transform: scale(0.7);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }

    }


    .s1 {
      top: 20%;
      left: 25%;
    }

    .s2 {
      top: 30%;
      right: 25%;
    }

    .s3 {
      bottom: 30%;
      left: 35%;
    }

    .s4 {
      bottom: 20%;
      right: 35%;
    }


    /* =================================
       POPUP BACKGROUND
    ================================= */

    .popup-container {

      position: fixed;

      inset: 0;

      background:
        rgba(30, 100, 160, 0.35);

      backdrop-filter:
        blur(5px);

      display: none;

      justify-content: center;
      align-items: center;

      z-index: 100;
    }


    .popup-container.show {

      display: flex;

      animation:
        fadeIn 0.3s ease;
    }


    @keyframes fadeIn {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }

    }


    /* =================================
       POPUP CARD
    ================================= */

    .popup {

      position: relative;

      width: min(330px, 85vw);

      min-height: 220px;

      padding: 35px 25px;

      background:
        rgba(255,255,255,0.95);

      border-radius: 25px;

      text-align: center;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,0.2);

      animation:
        popup 0.5s cubic-bezier(.17,.67,.35,1.4);
    }


    @keyframes popup {

      from {

        opacity: 0;

        transform:
          scale(0.5)
          rotate(-5deg);
      }

      to {

        opacity: 1;

        transform:
          scale(1)
          rotate(0);
      }

    }


    .popup h2 {

      color: #5da9e9;

      font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

      font-size: 36px;

      font-weight: 400;

      margin-bottom: 8px;
    }


    .popup p {

      color: #777;

      font-size: 13px;

      margin-bottom: 20px;
    }


    /* CLOSE BUTTON */

    .close {

      position: absolute;

      top: 12px;
      right: 16px;

      border: none;

      background: transparent;

      color: #aaa;

      font-size: 20px;

      cursor: pointer;
    }


    /* =================================
       FALLING LOVE WORDS
    ================================= */

    .love-word {

      position: fixed;

      top: -60px;

      z-index: 200;

      pointer-events: none;

      font-family:
        "Trebuchet MS",
        sans-serif;

      font-weight: 600;

      white-space: nowrap;

      animation:
        loveFall linear forwards;

      text-shadow:
        0 2px 5px
        rgba(0,0,0,0.1);
    }


    @keyframes loveFall {

      0% {

        transform:
          translateY(-70px)
          rotate(-10deg);

        opacity: 0;
      }

      10% {

        opacity: 1;
      }

      90% {

        opacity: 1;
      }

      100% {

        transform:
          translateY(115vh)
          rotate(20deg);

        opacity: 0;
      }

    }


    /* =================================
       MOBILE
    ================================= */

    @media (max-width: 600px) {

      .title {
        font-size: 38px;
      }

      .click-button {
        font-size: 12px;
        padding: 8px 18px;
      }

      .standing {
        transform: scale(0.75);
      }

      .stand2,
      .stand3,
      .stand4 {
        transform: scale(0.6);
      }

    }

  </style>
</head>


<body>

  <!-- =================================

  <div class="standing stand1">

  <!-- =================================

        class="close"

  <!-- =================================
       JAVASCRIPT
  ================================= -->

  <script>


    /* ================================
       RANDOM FLOWER CONFETTI
    ================================= */

    const flowerColors = [
      "pink",
      "yellow",
      "purple",
      "white",
      "orange",
      "blue"
    ];


    function createFlowerConfetti() {

      const flower =
        document.createElement("div");

      flower.classList.add(
        "flower",
        "falling-flower"
      );


      const randomColor =
        flowerColors[
          Math.floor(
            Math.random() *
            flowerColors.length
          )
        ];


      flower.classList.add(randomColor);


      flower.innerHTML = `

        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>

        <div class="flower-center"></div>

      `;


      flower.style.left =
        Math.random() * 100 + "vw";


      const size =
        0.35 +
        Math.random() * 0.7;


      flower.style.transform =
        `scale(${size})`;


      flower.style.animationDuration =
        (5 + Math.random() * 7) + "s";


      flower.style.animationDelay =
        Math.random() * 4 + "s";


      document.body.appendChild(flower);


      setTimeout(() => {

        flower.remove();

      }, 13000);

    }


    /* Keep creating flowers */

    setInterval(
      createFlowerConfetti,
      450
    );


    /* Initial flowers */

    for (let i = 0; i < 18; i++) {

      setTimeout(
        createFlowerConfetti,
        i * 200
      );

    }



    /* ================================
       OPEN POPUP
    ================================= */

    function openLove() {

      document
        .getElementById("popup")
        .classList.add("show");


      /* Start falling love messages */

      startLoveRain();

    }



    /* ================================
       CLOSE POPUP
    ================================= */

    function closeLove() {

      document
        .getElementById("popup")
        .classList.remove("show");

    }



    /* ================================
       LOVE WORDS
    ================================= */

    const loveWords = [

      "i love you ♡",
      "i love you more",
      "love you",
      "love you more",
      "i miss you ♡",
      "miss you",
      "always you",
      "my favorite",
      "you & me",
      "more than you know",
      "♡ i love you ♡",
      "still you",
      "only you",
      "you are special",
      "hehe i love you",
      "lovelovelove",
      "i choose you",
      "always ♡",
      "mwah",
      "kiss kiss",
      "take care",
      "stay with me",
      "you're my favorite",
      "i adore you",
      "so much love",
      "more more more",
      "i love you, okay?",
      "♡",
      "🌸",
      "💗",
      "🌷"

    ];


    const loveColors = [

      "#ff6f91",
      "#ff8fab",
      "#d66efd",
      "#5da9e9",
      "#ff9f68",
      "#e85d9e"

    ];



    /* ================================
       CREATE FALLING WORD
    ================================= */

    function createLoveWord() {

      const word =
        document.createElement("div");


      word.classList.add(
        "love-word"
      );


      word.textContent =
        loveWords[
          Math.floor(
            Math.random() *
            loveWords.length
          )
        ];


      word.style.left =
        Math.random() * 95 + "vw";


      word.style.fontSize =
        (12 + Math.random() * 9)
        + "px";


      word.style.color =
        loveColors[
          Math.floor(
            Math.random() *
            loveColors.length
          )
        ];


      word.style.animationDuration =
        (4 + Math.random() * 5)
        + "s";


      word.style.animationDelay =
        (Math.random() * 0.5)
        + "s";


      document.body.appendChild(word);


      setTimeout(() => {

        word.remove();

      }, 10000);

    }



    /* ================================
       LOVE RAIN
    ================================= */

    let loveRainStarted = false;


    function startLoveRain() {

      if (loveRainStarted) {
        return;
      }


      loveRainStarted = true;


      /* First burst */

      for (let i = 0; i < 35; i++) {

        setTimeout(
          createLoveWord,
          i * 100
        );

      }


      /* Continuous falling words */

      setInterval(
        createLoveWord,
        280
      );

    }


  </script>
