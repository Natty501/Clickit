<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Special Message</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(to right, #ffdde1, #ee9ca7);
      font-family: Arial, sans-serif;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 450px;
    }
    h1 {
      color: #e63946;
    }
    .message {
      font-size: 18px;
      margin-top: 15px;
      white-space: pre-wrap;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Loe, Rebisco! 😊</h1>
    <p class="message" id="msg"></p>
  </div>

  <script>
    const text = `**A little message for whoever is reading this. 💌**

Hey, you. Yes, ikaw na nagbabasa nito. 😌

I don't know what you're currently going through, pero I just want to remind you na **you don't have to figure everything out all at once.**

Maybe you're tired. Maybe you're confused about your future. Maybe you're silently dealing with something na hindi mo kayang ikwento kahit kanino. Or maybe you're simply trying your best to get through each day.

And that's okay.

Hindi mo kailangang laging maging strong. You’re allowed to rest, to feel lost, to make mistakes, and even to start over. Hindi ibig sabihin na mabagal ka, wala ka nang progress. Sometimes, surviving a difficult day is already an achievement.

Please don't compare your chapter to someone else's highlight. Everyone has their own timing, sariling struggles, and sariling path. **You are not behind. You're just moving at your own pace.**

So take it easy on yourself, okay? One step at a time. If today didn't go well, tomorrow is another chance. If you made a mistake, learn from it. If something didn't work out, maybe it wasn't meant to stay.

And if nobody has told you lately:

**I'm proud of you for still trying.** 🤍

Keep going, kahit konti-konti lang. Someday, you'll look back and realize na yung version of you who almost gave up was actually the one who kept you moving forward.

Take care of yourself. You deserve good things too. 🫶✨
`;

    let i = 0;
    function typeWriter() {
      if (i < text.length) {
        document.getElementById("msg").textContent += text.charAt(i);
        i++;
        setTimeout(typeWriter, 70);
      }
    }
    window.onload = typeWriter;
  </script>
</body>
</html>
